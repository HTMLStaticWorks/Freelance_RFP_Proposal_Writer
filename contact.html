<!-- contact.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"><title>Contact Us | PROPOSAL EXPERT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="py-5 bg-dark text-white text-center">
        <h1>Let's Start <span class="text-teal">Winning</span></h1>
        <p>Contact our RFP specialists for a free strategy session.</p>
    </header>
    <section class="container py-5">
        <div class="row g-5">
            <div class="col-md-6">
                <h3>Send us a Message</h3>
                <form class="needs-validation mt-4" novalidate>
                    <div class="mb-3"><input type="text" class="form-control py-3" placeholder="Full Name" required></div>
                    <div class="mb-3"><input type="email" class="form-control py-3" placeholder="Work Email" required></div>
                    <div class="mb-3"><textarea class="form-control py-3" rows="5" placeholder="Tell us about your RFP requirements" required></textarea></div>
                    <button type="submit" class="btn btn-primary px-5 py-3">SEND MESSAGE</button>
                </form>
            </div>
            <div class="col-md-6">
                <h3>Contact Information</h3>
                <div class="mt-4">
                    <p><strong>Address:</strong> 123 Enterprise Way, Suite 400, Chicago, IL</p>
                    <p><strong>Email:</strong> info@proposalexpert.com</p>
                    <p><strong>Phone:</strong> +1 (555) 000-0000</p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
