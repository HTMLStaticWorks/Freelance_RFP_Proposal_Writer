<!-- login.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PROPOSAL EXPERT</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body class="bg-light-gray">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-5">
                <div class="card card-premium shadow-lg p-4 p-md-5 border-0">
                    <div class="text-center mb-5">
                        <a href="index.html"><img src="assets/images/logo1.png" alt="Proposal Logo" class="mb-4" style="height: 40px;"></a>
                        <h3>Welcome Back</h3>
                        <p class="text-muted">Enter your credentials to access your dashboard.</p>
                    </div>
                    <form action="dashboard.html" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">EMAIL ADDRESS</label>
                            <input type="email" class="form-control py-3" placeholder="name@company.com" required>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label class="form-label small fw-bold">PASSWORD</label>
                                <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
                            </div>
                            <input type="password" class="form-control py-3" placeholder="••••••••" required>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3">LOGIN TO DASHBOARD</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Create one</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
