<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PROPOSAL EXPERT</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/headers.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-light-gray">
    <!-- Floating Toggles -->
    <div class="floating-toggles">
        <a id="theme-toggle" class="btn btn-toggle" title="Toggle Theme" role="button" href="javascript:void(0)">
            <i class="bi bi-moon-fill"></i>
        </a>
        <a id="rtl-toggle" class="btn btn-toggle" title="Toggle RTL" role="button" href="javascript:void(0)">
            RTL
        </a>
    </div>

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center py-5">
            <div class="col-xxl-5 col-xl-6 col-lg-9 col-md-11">
                <div class="card card-premium shadow-lg p-4 p-lg-5 border-0">
                    <div class="text-center mb-4">
                        <a href="index.html"><img src="assets/images/logo1.png" alt="Proposal Logo" class="mb-3 mx-auto d-block" style="height: 40px;"></a>
                        <h3 class="mb-1">Create Your Account</h3>
                        <p class="text-muted small">Join the platform to manage and win your next RFP.</p>
                    </div>
                    <form action="dashboard.html" class="needs-validation" novalidate>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">FIRST NAME</label>
                            <input type="text" class="form-control py-3" placeholder="John" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">LAST NAME</label>
                            <input type="text" class="form-control py-3" placeholder="Doe" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">COMPANY NAME</label>
                            <input type="text" class="form-control py-3" placeholder="Enterprise Ltd." required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-bold">WORK EMAIL</label>
                            <input type="email" class="form-control py-3" placeholder="name@company.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">PASSWORD</label>
                            <div class="password-field-group">
                                <input type="password" class="form-control py-3" placeholder="Minimum 8 characters" required>
                                <i class="bi bi-eye-slash toggle-password"></i>
                            </div>
                        </div>
                        <div class="mb-4 form-check d-flex align-items-center gap-2 ps-0">
                            <input type="checkbox" class="form-check-input m-0" id="terms" required>
                            <label class="form-check-label small mb-0" for="terms">I agree to the <a href="#" class="text-primary text-decoration-none">Terms & Conditions</a></label>
                        </div>
                        <a role="button" class="btn btn-primary w-100 py-3 mb-4" href="dashboard.html">CREATE ACCOUNT</a>
                        
                        <div class="social-divider">Or join with</div>
                        
                        <div class="d-grid gap-2">
                            <a href="#" class="btn-social">
                                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
                                Google
                            </a>
                            <a href="#" class="btn-social">
                                <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple">
                                Apple
                            </a>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
