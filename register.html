<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PROPOSAL EXPERT</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
</head>
<body class="bg-light-gray">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-6">
                <div class="card card-premium shadow-lg p-4 p-md-5 border-0">
                    <div class="text-center mb-5">
                        <a href="index.html"><img src="assets/images/logo.svg" alt="Logo" class="mb-4" style="height: 40px;"></a>
                        <h3>Create Your Account</h3>
                        <p class="text-muted">Join the platform to manage and win your next RFP.</p>
                    </div>
                    <form action="dashboard.html" class="needs-validation" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">FIRST NAME</label>
                                <input type="text" class="form-control py-3" placeholder="John" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">LAST NAME</label>
                                <input type="text" class="form-control py-3" placeholder="Doe" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">COMPANY NAME</label>
                            <input type="text" class="form-control py-3" placeholder="Enterprise Ltd." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">WORK EMAIL</label>
                            <input type="email" class="form-control py-3" placeholder="name@company.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">PASSWORD</label>
                            <input type="password" class="form-control py-3" placeholder="Minimum 8 characters" required>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-primary">Terms & Conditions</a></label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3">CREATE ACCOUNT</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
